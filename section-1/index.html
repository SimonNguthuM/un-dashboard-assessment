<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>Dashboard</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>
        </nav>
    </header>
    <div class="layout">
        <aside>
            <h3>Filters</h3>
            <div class = "filter-group">
                <label>Status</label>
                <select id="statusFilter">
                </select>
            </div>
            <div class = "filter-group">
                 <label>Department</label>
                <select id="departmentFilter">
                </select>
            </div>
            <div class = "filter-group">
                <label>Date Range</label>
                <input type = "date">
                <input type = "date">
            </div>
        </aside>
        <main>
            <section id="cards">
                <div class="card">Sample 1: <span>0</span></div>
                <div class="card">Sample 2: <span>0</span></div>
                <div class="card">Sample 3: <span>0</span></div>
                <div class="card">Sample 4: <span>0</span></div>
            </section>
            <section>
                <table>
                    <thead>
                        <tr>
                            <th>sample</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>sample</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <footer>
        <button>prev</button>
        <span>page 1 of ...</span>
        <button>next</button>
    </footer>
</body>
</html>
