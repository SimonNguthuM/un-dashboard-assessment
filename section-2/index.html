<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>Dashboard</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>
        </nav>
    </header>
    <div class="layout">
        <aside>
            <h3>Filters</h3>
            <div class = "filter-group">
                <label>Status</label>
                <select id="statusFilter">
                    <option value = "all">All</option>
                    <option value = "active">Active</option>
                    <option value = "inactive">Inactive</option>
                    <option value = "on leave">On Leave</option>
                </select>
            </div>
            <div class = "filter-group">
                 <label>Department</label>
                <select id="departmentFilter">
                    <option value = "all">All</option>
                    <option value = "Engineering">Engineering</option>
                    <option value = "HR">HR</option>
                    <option value = "Sales">Sales</option>
                </select>
            </div>
            <div class = "filter-group">
                <label>Date Range</label>
                <input type = "date">
                <input type = "date">
            </div>
        </aside>
        <main>
            <section id="cards">
                <div class="card">Total Employees: <span id="totalEmployees">0</span></div>
                <div class="card">Active Employees: <span id="activeEmployees">0</span></div>
                <div class="card">Average Salary: <span id="avgSalary">0</span></div>
                <div class="card">Departments: <span id="deptCount">0</span></div>
            </section>
            <section>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Status</th>
                            <th>Join Date</th>
                            <th>Salary Range</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">

                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <footer>
        <button>prev</button>
        <span>page 1 of ...</span>
        <button>next</button>
        <span id="fetchTime"></span>
    </footer>
    <script src="app.js"></script>
</body>
</html>
